<html>
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>漂泊者乐园象棋高级</title>
    <script type="text/javascript" src="book.js"></script>
    <script type="text/javascript" src="c4Position.js"></script>
    <script type="text/javascript" src="c4Search.js"></script>
    <script type="text/javascript" src="c4Board.js"></script>
    <script type="text/javascript" src="cchess.js"></script>
    <style type="text/css">
      body {
        background: url(../background.gif);
      }

      span.td {
        display: inline-block;
      }

      div.label {
        font-size: 14px;
        padding: 2px;
      }

      select {
        font-size: 14px;
        width: 108px;
        padding: 2px;
      }

      option {
        font-size: 14px;
      }

      input.button {
        font-size: 14px;
        width: 108px;
      }

      label {
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div style="text-align: center; font-size: 28px; font-family: 黑体">漂泊者乐园象棋大师
      <a href="https://github.com/littleflute/cchess/edit/master/play/index3.html">V0.0.12</a>
    </div>
    <div style="height: 16px"></div>
    <div style="text-align: center; white-space: nowrap">
      <span class="td" style="margin-right: 10px">
        <div id="container"></div>
      </span>
      <span class="td" style="vertical-align: top; width: 120px">
        <div style="text-align: left">
          <div class="label">谁先走</div>
          <div>
            <select id="selMoveMode" size="3">
              <option selected value="0">我先走</option>
              <option value="1">电脑先走</option>
              <option value="2">不用电脑</option>
            </select>
          </div>
          <div class="label">先走让子</div>
          <div>
            <select id="selHandicap" style="padding: 0px">
              <option selected value="0">不让子</option>
              <option value="1">让左马</option>
              <option value="2">让双马</option>
              <option value="3">让九子</option>
              <option value="4">七星聚会</option>
            </select>
          </div>
          <div style="padding-top: 2px">
            <input type="button" class="button" value="重新开始" onclick="game.restart()">
          </div>
          <div style="padding-top: 2px">
            <input type="button" class="button" value="悔棋" onclick="game.retract()">
          </div>
          <div style="height: 12px"></div>
          <div style="height: 12px"></div>
          <div>
            <input type="checkbox" class="checkbox" id="chkAnimated" checked onclick="board.animated = checked">
            <label for="chkAnimated">动画</label>
          </div>
          <div>
            <input type="checkbox" class="checkbox" checked onclick="board.setSound(checked)">
            <label for="chkSound">音效</label>
          </div>
          <div style="height: 60px"></div>
          <div class="label">步骤</div>
          <div>
            <select id="selMoveList" size="10" style="font-family: 宋体" onchange="game.moveListChange()">
              <option selected value="0">=== 开始 ===</option>
            </select>
          </div>
        </div>
      </span>
    </div>
    <script type="text/javascript">
      "use strict";

      const STARTUP_FEN = [
        "rnbakabnr/9/1c5c1/p1p1p1p1p/9/9/P1P1P1P1P/1C5C1/9/RNBAKABNR w",
        "rnbakabnr/9/1c5c1/p1p1p1p1p/9/9/P1P1P1P1P/1C5C1/9/RNBAKAB1R w",
        "rnbakabnr/9/1c5c1/p1p1p1p1p/9/9/P1P1P1P1P/1C5C1/9/R1BAKAB1R w",
        "rnbakabnr/9/1c5c1/p1p1p1p1p/9/9/9/1C5C1/9/RN2K2NR w",
        "4rk3/3P5/4bP3/9/9/8P/9/1p2p2C1/3p1p3/4K1RR1 w",
      ];

      class ChessGame {
        constructor(board) {
          this.board = board;
          this.selMoveList = document.getElementById('selMoveList');
          this.selMoveMode = document.getElementById('selMoveMode');
          this.selHandicap = document.getElementById('selHandicap');
          this.board.onAddMove = this.onAddMove.bind(this);
        }

        createOption(text, value, ie8) {
          const opt = document.createElement("option");
          opt.selected = true;
          opt.value = value;
          if (ie8) {
            opt.text = text;
          } else {
            opt.innerHTML = text.replace(/ /g, "&nbsp;");
          }
          return opt;
        }

        onAddMove() {
          const counter = (this.board.pos.mvList.length >> 1);
          const space = (counter > 99 ? "    " : "   ");
          const formattedCounter = (counter > 9 ? "" : " ") + counter + ".";
          const text = (this.board.pos.sdPlayer == 0 ? space : formattedCounter) + move2Iccs(this.board.mvLast);
          const value = "" + this.board.mvLast;
          try {
            this.selMoveList.add(this.createOption(text, value, false));
          } catch (e) {
            this.selMoveList.add(this.createOption(text, value, true));
          }
          this.selMoveList.scrollTop = this.selMoveList.scrollHeight;
        }

        restart() {
          this.selMoveList.options.length = 1;
          this.selMoveList.selectedIndex = 0;
          this.board.computer = 1 - this.selMoveMode.selectedIndex;
          this.board.restart(STARTUP_FEN[this.selHandicap.selectedIndex]);
        }

        retract() {
          for (let i = this.board.pos.mvList.length; i < this.selMoveList.options.length; i++) {
            this.board.pos.makeMove(parseInt(this.selMoveList.options[i].value));
          }
          this.board.retract();
          this.selMoveList.options.length = this.board.pos.mvList.length;
          this.selMoveList.selectedIndex = this.selMoveList.options.length - 1;
        }

        moveListChange() {
          if (this.board.result == RESULT_UNKNOWN) {
            this.selMoveList.selectedIndex = this.selMoveList.options.length - 1;
            return;
          }
          const from = this.board.pos.mvList.length;
          const to = this.selMoveList.selectedIndex;
          if (from == to + 1) {
            return;
          }
          if (from > to + 1) {
            for (let i = to + 1; i < from; i++) {
              this.board.pos.undoMakeMove();
            }
          } else {
            for (let i = from; i <= to; i++) {
              this.board.pos.makeMove(parseInt(this.selMoveList.options[i].value));
            }
          }
          this.board.flushBoard();
        }
      }

      const board = new Board(container, "images/", "sounds/");
      board.setSearch(16);
      board.millis = 1000;
      board.computer = 1;
      const game = new ChessGame(board);
    </script>
  </body>
</html>
